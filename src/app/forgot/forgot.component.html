<div class="card">

    <h1 class="logo">PayPilot</h1>


    <h2 class="title">Forgot Password</h2>


    <div id="step1">

        <input

            type="email"

            id="userEmail"

            placeholder="Enter your email"

            [(ngModel)]="email">


        <button (click)="sendOtp()">Send OTP</button>

    </div>


    <a routerLink="/login">Back To Login</a>

</div>
